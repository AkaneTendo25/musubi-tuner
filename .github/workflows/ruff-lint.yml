name: Ruff Lint

on:
  pull_request:
    branches:
      - main
  push:
    paths:
      - "src/musubi_tuner/**/*.py"
      - "src/musubi_tuner/**/*.pth"
      - ".python-version"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev

      # Run through uv so the ruff version is exactly the one pinned in
      # pyproject/uv.lock. astral-sh/ruff-action defaults to the LATEST ruff,
      # which ignores the <0.16 pin and floods CI with the ~2000 findings from
      # rules the pin exists to exclude.
      - name: "Run Ruff check"
        run: uv run ruff check --fix .

      - name: "Run Ruff format check"
        run: uv run ruff format --check .
          # will exit with a non-zero code if there are formatting changes

      # - name: Minimize uv cache
      #   run: uv cache prune --ci
