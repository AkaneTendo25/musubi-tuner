# Ref2VA training with both still-image and video targets.
# Cache text with --task ref2va and train with --h3_training_mode ref2va.
# Every target needs a separate basename-matched reference in its dataset's
# control directory.

[general]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = false

[[datasets]]
resolution = [1024, 1024]
target_image_directory = "/path/to/target_images"
target_modalities = ["image"]
source_image_directory = "/path/to/image_references"
source_modalities = ["image"]
cache_directory = "/path/to/ref2va_image_cache"
num_repeats = 1

[[datasets]]
resolution = [1344, 768]
target_video_directory = "/path/to/target_videos"
target_modalities = ["video", "audio"]
source_image_directory = "/path/to/video_references"
source_modalities = ["image"]
cache_directory = "/path/to/ref2va_video_cache"
source_fps = 24.0
target_frames = [124, 175, 243, 294, 362]
frame_extraction = "uniform"
frame_sample = 4
num_repeats = 1
