# Ref2VA training where each reference video's embedded soundtrack is conditioning.
# Cache text with --task ref2va and train with --h3_training_mode ref2va.

[general]
resolution = [1344, 768]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = false

[[datasets]]
target_video_directory = "/path/to/target_videos"
target_modalities = ["video", "audio"]
source_video_directory = "/path/to/reference_videos_with_audio"
source_modalities = ["video", "audio"]
source_video_audio_embedded = true
cache_directory = "/path/to/ref2va_embedded_av_cache"
source_fps = 24.0
target_frames = [124, 175, 243, 294, 362]
frame_extraction = "uniform"
frame_sample = 4
num_repeats = 1
