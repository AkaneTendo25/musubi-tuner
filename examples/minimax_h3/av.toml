# MiniMax H3 audio-video training with a synchronized soundtrack embedded in
# each target video.

[general]
resolution = [832, 480]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = false

[[datasets]]
video_directory = "/path/to/videos"
cache_directory = "/path/to/cache"
source_fps = 24.0
target_frames = [124, 175, 243, 294, 362]
frame_extraction = "uniform"
frame_sample = 4
num_repeats = 1
