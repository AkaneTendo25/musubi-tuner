# Image-only concept LoRA for the FL2VA transformer.
# Cache text with --task t2va and train with --h3_training_mode fl2va.

[general]
resolution = [768, 768]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = false

[[datasets]]
target_image_directory = "/path/to/target_images"
target_modalities = ["image"]
cache_directory = "/path/to/fl2va_image_cache"
num_repeats = 1
